<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Strong Glow Filter for Crimson Accent -->
    <filter id="glow-mobile" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComponentTransfer in="blur" result="boost">
        <feFuncA type="linear" slope="1.8"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="boost" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Primary Crimson to Red Gradient -->
    <linearGradient id="grad-crimson-mobile" x1="12" y1="8" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF3E44" />
      <stop offset="60%" stop-color="#C22026" />
      <stop offset="100%" stop-color="#7B0F13" />
    </linearGradient>

    <!-- Subtle radar/connection line gradient -->
    <linearGradient id="grad-mobile-radar" x1="32" y1="8" x2="32" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF3E44" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#A91D22" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- High-tech Mobile signals & grid in background -->
  <!-- Signal radar waves -->
  <path d="M16 12C22 8 42 8 48 12" stroke="url(#grad-mobile-radar)" stroke-width="1.2" stroke-linecap="round" />
  <path d="M10 7C18 3 46 3 54 7" stroke="url(#grad-mobile-radar)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3" />
  <!-- Layout grids -->
  <line x1="6" y1="32" x2="58" y2="32" stroke="url(#grad-mobile-radar)" stroke-width="1" />
  <line x1="10" y1="18" x2="54" y2="18" stroke="url(#grad-mobile-radar)" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="10" y1="46" x2="54" y2="46" stroke="url(#grad-mobile-radar)" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Center Floating Isometric/3D Smartphone Chassis (Main Highlight - Scaled Up for Visual Pop) -->
  <g filter="url(#glow-mobile)">
    <!-- Sleek Smartphone Chassis Frame -->
    <rect x="18" y="8" width="28" height="48" rx="5" stroke="url(#grad-crimson-mobile)" stroke-width="3" fill="#141416" fill-opacity="0.8" />
    
    <!-- Screen glass area inside -->
    <rect x="21" y="12" width="22" height="40" rx="3" stroke="#5A181C" stroke-width="1.8" fill="#1C1C1E" />
    
    <!-- Device details: top ear speaker notch and bottom home indicator bar -->
    <line x1="28" y1="10" x2="36" y2="10" stroke="url(#grad-crimson-mobile)" stroke-width="1.8" stroke-linecap="round" />
    <rect x="28" y="48.5" width="8" height="1.5" rx="0.75" fill="#FF3E44" />

    <!-- Sleek glowing interface layout on screen -->
    <!-- Active mobile layout components -->
    <rect x="24" y="16" width="16" height="12" rx="2" fill="url(#grad-crimson-mobile)" fill-opacity="0.3" stroke="url(#grad-crimson-mobile)" stroke-width="1.2" />
    
    <!-- Small grid/layout nodes and active state indicators -->
    <circle cx="26" cy="33" r="1.8" fill="#FF3E44" />
    <circle cx="38" cy="33" r="1.8" fill="#32D74B" />
    <circle cx="26" cy="39" r="1.8" fill="#32D74B" />
    <circle cx="38" cy="39" r="1.8" fill="#FF9F0A" />

    <!-- Outside Floating/Connected Nodes (Representing cross-platform API nodes) -->
    <path d="M10 32L18 32" stroke="#FF3E44" stroke-width="1.2" stroke-dasharray="2 2" />
    <circle cx="8" cy="32" r="3.5" fill="#32D74B" stroke="url(#grad-crimson-mobile)" stroke-width="1" />

    <path d="M54 32L46 32" stroke="#FF3E44" stroke-width="1.2" stroke-dasharray="2 2" />
    <circle cx="56" cy="32" r="3.5" fill="#FF3E44" stroke="url(#grad-crimson-mobile)" stroke-width="1" />
  </g>
</svg>
