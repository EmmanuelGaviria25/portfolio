<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Strong Glow Filter for Crimson Accent -->
    <filter id="glow-leader" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComponentTransfer in="blur" result="boost">
        <feFuncA type="linear" slope="1.8"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="boost" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Primary Crimson to Red Gradient -->
    <linearGradient id="grad-crimson-leader" x1="12" y1="8" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF3E44" />
      <stop offset="60%" stop-color="#C22026" />
      <stop offset="100%" stop-color="#7B0F13" />
    </linearGradient>

    <!-- Subtle radar/guidance line gradient -->
    <linearGradient id="grad-leader-radar" x1="32" y1="8" x2="32" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF3E44" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#A91D22" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- High-tech Coordination & Guidance Lines in Background -->
  <!-- Target circles representing milestone metrics -->
  <circle cx="32" cy="32" r="26" stroke="url(#grad-leader-radar)" stroke-width="1.2" />
  <circle cx="32" cy="32" r="18" stroke="url(#grad-leader-radar)" stroke-width="1.2" stroke-dasharray="4 2" />
  <!-- Dotted coordinate crosshairs -->
  <line x1="6" y1="32" x2="58" y2="32" stroke="url(#grad-leader-radar)" stroke-width="1.2" stroke-dasharray="3 3" />
  <line x1="32" y1="6" x2="32" y2="58" stroke="url(#grad-leader-radar)" stroke-width="1.2" stroke-dasharray="3 3" />

  <!-- Center Floating Premium Geometric Diamond Crown/Shield (Main Highlight - Scaled Up for Visual Pop) -->
  <g filter="url(#glow-leader)">
    <!-- Main Outer Diamond/Shield Border -->
    <path d="M32 6 L52 22 V42 L32 58 L12 42 V22 Z" stroke="url(#grad-crimson-leader)" stroke-width="3" stroke-linejoin="round" fill="#141416" fill-opacity="0.8" />
    
    <!-- Central Glowing 8-Pointed Leadership Compass Star -->
    <path d="M32 16 L36 28 L48 32 L36 36 L32 48 L28 36 L16 32 L28 28 Z" stroke="url(#grad-crimson-leader)" stroke-width="2" fill="#1C1C1E" />
    <!-- Core sparkling node -->
    <circle cx="32" cy="32" r="4.5" fill="#FF3E44" />
    
    <!-- Dotted active milestone connectors on the tips of the star -->
    <circle cx="32" cy="6" r="2" fill="#32D74B" stroke="url(#grad-crimson-leader)" stroke-width="1" /> <!-- Top Green active -->
    <circle cx="12" cy="22" r="2" fill="#32D74B" stroke="url(#grad-crimson-leader)" stroke-width="1" /> <!-- Left Green active -->
    <circle cx="52" cy="22" r="2" fill="#32D74B" stroke="url(#grad-crimson-leader)" stroke-width="1" /> <!-- Right Green active -->
    <circle cx="32" cy="58" r="2" fill="#32D74B" stroke="url(#grad-crimson-leader)" stroke-width="1" /> <!-- Bottom Green active -->
  </g>
</svg>
