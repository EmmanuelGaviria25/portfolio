<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Strong Glow Filter for Crimson Accent -->
    <filter id="glow-backend" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComponentTransfer in="blur" result="boost">
        <feFuncA type="linear" slope="1.8"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="boost" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Primary Crimson to Red Gradient -->
    <linearGradient id="grad-crimson-backend" x1="12" y1="8" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF3E44" />
      <stop offset="60%" stop-color="#C22026" />
      <stop offset="100%" stop-color="#7B0F13" />
    </linearGradient>

    <!-- Subtle wireframe/data-flow line gradient -->
    <linearGradient id="grad-flow" x1="32" y1="8" x2="32" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF3E44" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#A91D22" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Sleek Dotted Networking Pipelines in the Background -->
  <!-- Left path -->
  <path d="M10 28C10 16 32 10 32 10" stroke="url(#grad-flow)" stroke-width="1.2" stroke-dasharray="3 3" />
  <!-- Right path -->
  <path d="M54 28C54 16 32 10 32 10" stroke="url(#grad-flow)" stroke-width="1.2" stroke-dasharray="3 3" />
  <!-- Center main core pipeline -->
  <line x1="32" y1="6" x2="32" y2="58" stroke="url(#grad-flow)" stroke-width="1.5" />
  
  <!-- Horizontal connection lines -->
  <line x1="8" y1="30" x2="56" y2="30" stroke="url(#grad-flow)" stroke-width="1.2" stroke-linecap="round" />
  <line x1="8" y1="42" x2="56" y2="42" stroke="url(#grad-flow)" stroke-width="1.2" stroke-linecap="round" />

  <!-- Center Floating Server Cylinder Stack (Main Highlight - Scaled Up for Visual Pop) -->
  <g filter="url(#glow-backend)">
    
    <!-- 1. CYLINDER 3 (BOTTOM) - Drawn first so layers stack from back to front -->
    <!-- Cylinder Body -->
    <path d="M 10 42 V 49 A 22 6 0 0 0 54 49 V 42 A 22 6 0 0 1 10 42 Z" stroke="url(#grad-crimson-backend)" stroke-width="3" stroke-linejoin="round" fill="#141416" fill-opacity="0.85" />
    <!-- Cylinder Top Face -->
    <ellipse cx="32" cy="42" rx="22" ry="6" stroke="url(#grad-crimson-backend)" stroke-width="3" fill="#1C1C1E" />
    
    <!-- 2. CYLINDER 2 (MIDDLE) -->
    <!-- Cylinder Body -->
    <path d="M 10 28 V 35 A 22 6 0 0 0 54 35 V 28 A 22 6 0 0 1 10 28 Z" stroke="url(#grad-crimson-backend)" stroke-width="3" stroke-linejoin="round" fill="#141416" fill-opacity="0.85" />
    <!-- Cylinder Top Face -->
    <ellipse cx="32" cy="28" rx="22" ry="6" stroke="url(#grad-crimson-backend)" stroke-width="3" fill="#1C1C1E" />
    
    <!-- 3. CYLINDER 1 (TOP) -->
    <!-- Cylinder Body -->
    <path d="M 10 14 V 21 A 22 6 0 0 0 54 21 V 14 A 22 6 0 0 1 10 14 Z" stroke="url(#grad-crimson-backend)" stroke-width="3" stroke-linejoin="round" fill="#141416" fill-opacity="0.85" />
    <!-- Cylinder Top Face -->
    <ellipse cx="32" cy="14" rx="22" ry="6" stroke="url(#grad-crimson-backend)" stroke-width="3" fill="#1C1C1E" />
    
    <!-- Active Status LEDs (Mini front lights for high tech look) -->
    <!-- Top Cylinder LED lights -->
    <circle cx="21" cy="18.5" r="1.5" fill="#32D74B" />
    <circle cx="27" cy="18.5" r="1.5" fill="#32D74B" />
    
    <!-- Middle Cylinder LED lights -->
    <circle cx="21" cy="32.5" r="1.5" fill="#32D74B" />
    <circle cx="27" cy="32.5" r="1.5" fill="#FF9F0A" /> <!-- Yellow Warning light -->
    
    <!-- Bottom Cylinder LED lights -->
    <circle cx="21" cy="46.5" r="1.5" fill="#32D74B" />
    <circle cx="27" cy="46.5" r="1.5" fill="#FF453A" /> <!-- Red alert light -->

    <!-- Base Connector Core Glow -->
    <circle cx="32" cy="55" r="4.5" fill="#FF3E44" />
  </g>
</svg>
