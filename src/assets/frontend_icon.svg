<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Strong Glow Filter for Crimson Accent -->
    <filter id="glow-frontend" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComponentTransfer in="blur" result="boost">
        <feFuncA type="linear" slope="1.8"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="boost" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Primary Crimson to Red Gradient -->
    <linearGradient id="grad-crimson" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF3E44" />
      <stop offset="60%" stop-color="#C22026" />
      <stop offset="100%" stop-color="#7B0F13" />
    </linearGradient>

    <!-- Subtle wireframe gradient -->
    <linearGradient id="grad-wireframe" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF3E44" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#A91D22" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Dynamic Wireframe Layout Background (Transparent and elegant) -->
  <!-- Top header slot -->
  <rect x="6" y="8" width="52" height="6" rx="2" stroke="url(#grad-wireframe)" stroke-width="1.2" fill="none" />
  <!-- Left content container -->
  <rect x="6" y="18" width="16" height="38" rx="3" stroke="url(#grad-wireframe)" stroke-width="1.2" fill="none" />
  <!-- Right upper layout slot -->
  <rect x="26" y="18" width="32" height="12" rx="3" stroke="url(#grad-wireframe)" stroke-width="1.2" fill="none" />
  <!-- Right lower layout slot -->
  <rect x="26" y="34" width="32" height="22" rx="3" stroke="url(#grad-wireframe)" stroke-width="1.2" fill="none" />

  <!-- Center Floating Floating Code Tags (Main Highlight - Scaled Up for Visual Pop) -->
  <g filter="url(#glow-frontend)">
    <!-- Web Development Code Symbol (</>) -->
    <!-- Left Bracket < -->
    <path d="M18 16L6 32L18 48" stroke="url(#grad-crimson)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Right Bracket > -->
    <path d="M46 16L58 32L46 48" stroke="url(#grad-crimson)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Slash / -->
    <path d="M38 10L26 54" stroke="url(#grad-crimson)" stroke-width="4.5" stroke-linecap="round" />
  </g>
</svg>
